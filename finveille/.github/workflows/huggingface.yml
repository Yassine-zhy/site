# Met FinVeille en ligne sur Hugging Face Spaces à chaque push sur main (guide 25). Comme tests.yml, ce fichier n'est
# actif que si finveille/ est à la racine de son propre dépôt GitHub. (Dans le dépôt actuel, c'est
# .github/workflows/finveille-huggingface.yml, à la racine, qui s'en charge.)
#
# Réglage, une seule fois : Settings → Secrets and variables → Actions → New repository secret
#   HF_TOKEN       (obligatoire) jeton « Write » de https://huggingface.co/settings/tokens
#   GEMINI_API_KEY, DATABASE_URL, SMTP_…, ADMIN_EMAILS… : recopiés automatiquement dans le Space
# Le Space est créé automatiquement (« ton-pseudo/finveille », ou la variable HF_SPACE).
name: Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Jeton Hugging Face présent ?
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Secret HF_TOKEN absent : rien n'est publié (voir guide 25)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
        if: steps.token.outputs.ok == 'true'
      - name: Publier
        if: steps.token.outputs.ok == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SECRETS_TOML: ${{ secrets.SECRETS_TOML }}
        run: python deploy/publish_space.py
