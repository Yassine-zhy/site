# Lance les tests à chaque push. Ce fichier n'est actif que si finveille/ est à la RACINE d'un dépôt
# GitHub (voir guide/09, « Mettre le projet dans son propre dépôt ») : GitHub ne lit que .github/ à la racine.
name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Une base PostgreSQL jetable, démarrée pour la durée des tests (étape 20) : les tests de stockage
    # tournent ainsi sur SQLite ET sur PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finveille
          POSTGRES_PASSWORD: finveille
          POSTGRES_DB: finveille_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINVEILLE_TEST_DATABASE_URL: postgresql://finveille:finveille@localhost:5432/finveille_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
