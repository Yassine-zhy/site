# Met FinVeille (dossier finveille/) en ligne sur Hugging Face Spaces. Guide : finveille/guide/25-tenir-la-charge.md.
#
# ⚠ Depuis octobre 2026, Hugging Face réserve les Spaces Docker à l'abonnement PRO (réponse « 402 Payment
# Required » au premier essai). Ce workflow ne se lance donc plus tout seul : la mise en ligne gratuite passe par
# Streamlit Community Cloud (guide 25, § 6). Avec un compte PRO : onglet Actions → ce workflow → Run workflow
# (bouton visible quand ce fichier est sur la branche principale), ou python deploy/publish_space.py à la main.
#
# Réglage : Settings → Secrets and variables → Actions → New repository secret
#   HF_TOKEN        (obligatoire) jeton « Write » créé sur https://huggingface.co/settings/tokens
#   GEMINI_API_KEY  (conseillé)   recopié automatiquement dans le Space, comme DATABASE_URL, SMTP_…, ADMIN_EMAILS…
name: FinVeille → Hugging Face

on:
  workflow_dispatch:  # lancement manuel seulement (voir l'avertissement ci-dessus)

concurrency:
  group: finveille-huggingface
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Jeton Hugging Face présent ?
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Secret HF_TOKEN absent : ajoute-le (Settings → Secrets and variables → Actions), puis relance ce travail."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finveille/requirements-dev.txt
      - name: Tests (on ne publie qu'un site qui passe ses tests)
        if: steps.token.outputs.ok == 'true'
        working-directory: finveille
        run: |
          pip install -r requirements-dev.txt "huggingface_hub>=0.30"
          pytest -q
      - name: Publier sur Hugging Face
        if: steps.token.outputs.ok == 'true'
        working-directory: finveille
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SECRETS_TOML: ${{ secrets.SECRETS_TOML }}
        run: python deploy/publish_space.py
