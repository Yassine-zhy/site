[theme]
font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

# Le bouton principal (bleu) a un texte blanc : en clair comme en sombre, le bleu est assez
# foncé pour que ce texte reste lisible (contraste supérieur à 4,5:1).
[theme.light]
primaryColor = "#1F4ED8"            # le bleu FinVeille
backgroundColor = "#F4F6FB"         # fond de page gris bleuté très clair
secondaryBackgroundColor = "#FFFFFF" # champs de saisie
textColor = "#0B1220"
borderColor = "#D6DDE8"
linkColor = "#1F4ED8"
codeBackgroundColor = "#EDF0F5"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#3A69EA"            # un bleu plus lumineux, toujours lisible sous un texte blanc
backgroundColor = "#060912"         # bleu nuit profond, comme un terminal de salle de marché
secondaryBackgroundColor = "#0F1626"
textColor = "#E8EDF6"
borderColor = "#24304A"
linkColor = "#6F95FF"
codeBackgroundColor = "#0F1626"

[theme.dark.sidebar]
backgroundColor = "#0A0F1A"
