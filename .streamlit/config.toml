# Identité visuelle de FinVeille : une plateforme d'information financière, sobre et lisible.
# Deux palettes complètes (claire / sombre) ; l'utilisateur choisit dans le menu ⋮ :
# Système, Clair ou Sombre. Les couleurs propres à FinVeille (cartes, hausse, baisse…) sont
# définies dans theme.py et suivent le même choix.

[client]
toolbarMode = "viewer"          # cache les outils de développement (bouton « Deploy »…)

# Tenir la charge (guide 25). Mesuré avec tools/load_test.py : 200 visiteurs arrivés ensemble sont tous servis
# en 11 s, contre des déconnexions dès 100 visiteurs avec les réglages par défaut.
[server]
# Ne pas surveiller les fichiers du code : cette surveillance (pour recharger l'appli quand on modifie le code)
# occupait 90 % du temps du serveur sous charge. Pour développer avec rechargement automatique :
#   streamlit run app.py --server.fileWatcherType auto
fileWatcherType = "none"
websocketPingInterval = 45      # un serveur très occupé a 45 s (au lieu de 30) pour répondre aux navigateurs
# Le dossier static/ est servi à l'adresse app/static/ : le moteur 3D et Three.js (guide 30), mis en cache par le
# navigateur au lieu d'être renvoyés à chaque affichage
enableStaticServing = true

[runner]
# Par défaut, Streamlit lance un grand ménage de la mémoire (gc.collect) après CHAQUE affichage : le serveur
# entier s'arrête pendant ce temps. Python fait déjà ce ménage tout seul, au bon moment ; et nos mémoires sont
# bornées (core/capacity.py), elles ne peuvent pas grossir sans fin.
postScriptGC = false

[browser]
gatherUsageStats = false        # pas de statistiques d'usage envoyées à Streamlit

# Les polices (IBM Plex, Newsreader, Schibsted Grotesk ; licence SIL OFL, voir static/fonts/OFL.txt) sont servies par
# le site lui-même, depuis static/fonts/ : le navigateur ne contacte pas Google Fonts, donc n'envoie pas l'adresse IP
# du visiteur à Google (RGPD). Newsreader et Schibsted Grotesk sont employées par theme.py.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
