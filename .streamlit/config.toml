# Identité visuelle de FinVeille : une plateforme d'information financière, sobre et lisible.
# Deux palettes complètes (claire / sombre) ; l'utilisateur choisit dans le menu ⋮ :
# Système, Clair ou Sombre. Les couleurs propres à FinVeille (cartes, hausse, baisse…) sont
# définies dans theme.py et suivent le même choix.

[client]
toolbarMode = "viewer"          # cache les outils de développement (bouton « Deploy »…)

[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

# Le bouton principal (bleu) a un texte blanc : en clair comme en sombre, le bleu est assez
# foncé pour que ce texte reste lisible (contraste supérieur à 4,5:1).
[theme.light]
primaryColor = "#1F4ED8"            # le bleu FinVeille
backgroundColor = "#F4F6F9"         # fond de page gris bleuté très clair
secondaryBackgroundColor = "#FFFFFF" # champs de saisie
textColor = "#0F1724"
borderColor = "#D5DBE3"
linkColor = "#1F4ED8"
codeBackgroundColor = "#EDF0F5"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#3A69EA"            # un bleu plus lumineux, toujours lisible sous un texte blanc
backgroundColor = "#0A0D12"         # bleu nuit
secondaryBackgroundColor = "#151B24"
textColor = "#E6EAF0"
borderColor = "#283241"
linkColor = "#6F95FF"
codeBackgroundColor = "#151B24"

[theme.dark.sidebar]
backgroundColor = "#0E1218"
