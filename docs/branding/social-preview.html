<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FinVeille, aperçu GitHub</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Aperçu GitHub (Settings → Social preview) : 1280 × 640, marge de sécurité de 40 px sur chaque bord. */
  .canvas { width: 1280px; height: 640px; }
  .copy { position: absolute; left: 72px; top: 72px; width: 600px; }
  .brand { font-size: 30px; }
  .headline { margin-top: 44px; font-size: 58px; }
  .lede { margin-top: 22px; max-width: 520px; font-size: 21px; line-height: 1.5; color: var(--muted); }
  .chips { position: absolute; left: 72px; bottom: 64px; font-size: 16px; }
  .window { left: 700px; top: 92px; width: 900px;
    transform: perspective(2000px) rotateY(-18deg) rotateX(6deg) rotateZ(1.5deg); transform-origin: left top; }
  .tile { left: 640px; top: 400px; width: 250px; }
</style>
</head>
<body>
<main class="canvas">
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="fvg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6cff"/><stop offset="1" stop-color="#1536b4"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#fvg)"/><rect x="16" y="13" width="9.5" height="38" rx="3.5" fill="#fff"/><rect x="16" y="13" width="32" height="9.5" rx="3.5" fill="#fff"/><path d="M25.5 38.5 L32 33.2 L38 36.2 L46 28.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46.5" cy="28" r="5" fill="#6ee7a8"/></svg><span class="wordmark">Fin<em>Veille</em></span></div>
    <h1 class="headline">La veille financière mondiale, <em>triée et expliquée.</em></h1>
    <p class="lede">L'actualité de 12 sources, les marchés en direct et un assistant IA qui cite ses sources. En français, gratuit.</p>
  </div>
  <div class="chips"><span class="chip">Python</span><span class="chip">Streamlit</span>
    <span class="chip">IA · RAG</span><span class="chip">PostgreSQL</span></div>
  <div class="window"><div class="window-bar"><i></i><i></i><i></i><span>finveille · Marchés</span></div>
    <img src="marches-sombre.jpg" alt=""></div>
  <div class="tile"><div class="tile-name">S&amp;P 500</div><div class="tile-value">7 811,54</div>
    <div class="tile-delta">▲ +0,59 %</div><svg width="96" height="34" viewBox="0 0 96 34" aria-hidden="true"><defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d17f" stop-opacity=".35"/><stop offset="1" stop-color="#34d17f" stop-opacity="0"/></linearGradient></defs><path d="M2 26 L10 30 L18 22 L24 24 L30 14 L38 18 L46 15 L54 16 L62 12 L70 8 L78 11 L86 5 L92 4 L92 34 L2 34 Z" fill="url(#sp)"/><path d="M2 26 L10 30 L18 22 L24 24 L30 14 L38 18 L46 15 L54 16 L62 12 L70 8 L78 11 L86 5 L92 4" fill="none" stroke="#34d17f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="92" cy="4" r="3" fill="#34d17f"/></svg></div>
</main>
</body>
</html>
